; Template configuration. Copy this file to "config.ini" and fill in real
; values. "config.ini" is gitignored so your host, paths, and selected folders
; never get committed. Secrets (the remote password) live in ".env" — see
; ".env.example".

[PATHS]
source_dir = "C:\path\to\source"
staging_dir = "C:\path\to\staging"
restore_dir = "C:\path\to\restored"

[DATABASE]
; PostgreSQL is the only supported catalog backend.
host = localhost
port = 5432
dbname = lto_archive
user = lto
; sslmode: 'prefer' is fine for a loopback/Docker server (no TLS offered). For
; any NON-loopback host use 'require' at minimum, or 'verify-full' to also
; authenticate the server — otherwise credentials and paths can travel in clear.
sslmode = prefer

[HARDWARE]
lto_drive = E:\\
; ltfs_ownership_id: REQUIRED — the stable identity of the PHYSICAL tape drive.
; It names the cross-process ownership mutex that guarantees only one process
; (archiver, watchdog helper, maintenance script) touches LTFS at a time:
;     Global\OWC_LTO8_LTFS_OWNERSHIP_<ltfs_ownership_id>
; Do NOT derive it from the mount letter: the letter is not stable across
; remounts, and two processes reading different config revisions would then
; build different mutex names for the same drive and both believe they owned
; it. Use the drive serial number (LtfsCmdDrives / the drive label) — e.g.
; drive_1097008774.
; Allowed characters: 1-64 of A-Z a-z 0-9 . _ -
; If unset or malformed, every LTFS operation fails closed.
ltfs_ownership_id = drive_REPLACE_WITH_DRIVE_SERIAL
; How long to wait for LTFS ownership before failing, in seconds. Clamped to
; 1..3600; neither value creates a polling loop. The writer may legitimately
; hold ownership for minutes during a tape write, so it waits longer; a helper
; or diagnostic should give up quickly and must never probe the drive instead.
ltfs_writer_lock_timeout_seconds = 300
ltfs_helper_lock_timeout_seconds = 30
ibm_eject_cmd = "C:\Program Files\IBM\LTFS\LtfsCmdEject.exe"

[PIPELINE]
; Byte-bounded ready queue (Phase 4). All byte values are INTEGER BYTES and
; describe files already prepared on the STAGING DISK — never memory. Nothing
; allocates in proportion to these numbers.
;
; Before this existed the writer took a single ~1.7 GB chunk, held the tape for
; 20-40 s, released it and left the drive idle for 25-37 minutes: a 1.9% duty
; cycle with 698 GB of the staging allowance unused. These limits let several
; chunks accumulate and then be written consecutively under ONE LTFS ownership
; period.
;
; Required ordering (violating it falls back to the documented defaults):
;   0 < min_ready_bytes_before_writer_start <= target_ready_bytes <= max_ready_bytes
;   max_ready_chunks > 0
; Keep max_ready_bytes comfortably below [PERFORMANCE] staging_max_gb.
min_ready_bytes_before_writer_start = 21474836480   ; 20 GiB
target_ready_bytes                  = 42949672960   ; 40 GiB
max_ready_bytes                     = 85899345920   ; 80 GiB
max_ready_chunks                    = 48
;
; Phase 4.5 control signals.
;
; ready_queue_staging_reserve_bytes: local staging the ready queue must NEVER
; consume, so an active fetch + active pack + temp pack output + manifests and
; resume metadata always have room. 0 = auto = 2*chunk_cap + 20 GiB reserve
; (the same 2x fetch+pack peak the capacity gate already sizes on). Validated at
; startup: max_ready_bytes + this reserve must fit inside staging_max_gb, or the
; whole set falls back atomically to the documented defaults (never a silent
; one-value clamp); if even the defaults cannot fit, the run refuses to start.
; The staging-pressure DRAIN has NO tunables: it engages when the producer
; cannot fit the next chunk's fetch+pack footprint under the staging cap and
; clears with hysteresis once there is room for two footprints, all measured
; from local staging only — never from LTFS.
ready_queue_staging_reserve_bytes   = 0
;
; max_unstaged_backlog_chunks (Plan 1 Task 1.3): how many SEALED but not yet
; staged chunks may exist before the scanner pauses publishing. This is a bound
; on how far exploration may run ahead of fetch/pack — NOT a barrier that must
; drain first. The count is re-derived from authoritative chunk status on every
; scheduling decision, so a crash or a second process cannot leave it wrong, and
; the stager takes work in chunk-index order straight from the database. That is
; what stops a large resumed backlog from postponing renewed scanning, which the
; old bounded hand-off queue did.
max_unstaged_backlog_chunks         = 64

[SETTINGS]
zip_threshold_mb = 2048
max_zip_size_gb = 20

[CATALOG]
; Packed files below this threshold are stored in per-bundle manifests,
; not as hot files_index rows. Large files remain searchable in files_index.
index_min_file_mb = 10
index_packed_small_files = false
index_directory_stats = true
index_full_directory_tree = true
prefer_directory_containers = true
small_file_manifest_enabled = true
small_file_manifest_format = jsonl
small_file_manifest_compression = zstd

[REMOTE]
remote_host = your.remote.host
remote_user = your-username
; Leave blank here; set REMOTE_PASSWORD in .env instead (see .env.example).
remote_password =
remote_path = /path/to/remote/source
; One path per indented line; each must be under remote_path.
remote_selected_paths =
    /path/to/remote/source/subdir_a
    /path/to/remote/source/subdir_b
confirm_before_backup = true
; tape_label: the cartridge a NEW session targets. Leave blank to be prompted.
; It exists so a fresh session can name its target WITHOUT reading the drive —
; every drive, volume, readiness and cartridge check now happens only inside a
; finite write group that already holds LTFS ownership. A RESUMED session
; ignores this and uses its persisted label/generation, so editing it can never
; re-point work that is already planned against a cartridge.
tape_label =
staging_fill_pct = 0.80
; large_file_min_mb: files at or above this size are archived loose rather than
; packed into a container, so they stay individually restorable.
large_file_min_mb = 10
; incremental_scan: persist a directory frontier so a restart re-lists only the
; one directory that was mid-listing, instead of replaying every configured root
; from the beginning. DEFAULT false, and false is also what any unrecognised
; value means. Turning it on is NOT enough on its own: migration 014 and its
; finalized constraints must validate first, or the legacy scanner stays active
; and the run says why. Never enable it for a session that is already publishing
; frontier state without following the reconciliation path in Plan 1 Task 4.2 —
; the two scanners must never both run against one frontier.
incremental_scan = false

[PERFORMANCE]
; Controlled tape-first pipeline: protect LTFS writes from competing heavy I/O,
; keep chunks bounded by bytes and file count, and apply RAM/staging backpressure.
; NOTE: keep comments on their own lines — inline comments after a value are
; treated as part of the value by the config parser.
pipeline_profile      = tape_first_controlled
; chunk_cap_gb: hard cap per chunk in GB
chunk_cap_gb          = 50
; chunk_max_files: hard cap per chunk by file count
chunk_max_files       = 100000
; prefetch_chunks_ahead: max chunks fetched/packed ahead of the tape writer
prefetch_chunks_ahead = 1
; staging_max_gb: hard backpressure — total staging usage never exceeds this
staging_max_gb        = 700
ram_soft_limit_pct    = 70
ram_hard_limit_pct    = 85
fetch_target_mbs      = 100
fetch_min_free_ram_gb = 16
governor_fetch_target_free_ram_gb = 4.0
governor_fetch_min_free_floor_gb = 2.5
governor_tape_min_free_ram_gb = 3.0
governor_tape_pause_other_stages = true
governor_tape_exclusive_heavy_stages = true
governor_soft_relax_after_seconds = 120
governor_soft_relax_factor = 0.75
governor_status_interval_seconds = 60
governor_memory_sample_interval_seconds = 5
governor_metadata_batch_size = 10000
governor_pack_file_batch_size = 10000
tape_write_exclusive  = true
allow_fetch_during_tape_write   = false
allow_pack_during_tape_write    = false
allow_db_sync_during_tape_write = false
allow_db_sync_during_fetch      = false
allow_pack_during_fetch         = conditional
allow_pack_above_ram_soft       = false
allow_resume_oversized_chunks   = false
; robocopy_priority: tape-write CPU priority — high | normal | realtime (realtime needs admin)
robocopy_priority     = high
; cpu_affinity: auto | off | "fetch=0-5;tape=6-7" (isolate fetch cores from tape cores)
cpu_affinity          = auto
; ssh_cipher: fast AES-NI cipher for the fetch stream
ssh_cipher            = aes128-gcm@openssh.com
; ssh_command_timeout_seconds: max time for remote command-style SSH calls
ssh_command_timeout_seconds = 3600
; use_mbuffer: wrap the remote tar in mbuffer (must be installed on the remote host)
use_mbuffer           = false
; mbuffer_size: remote-side mbuffer RAM ring size
mbuffer_size          = 512M

[TELEGRAM]
; Optional push notifications for backup summaries and Storage Map outcomes.
; Leave disabled unless TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set in .env.
enabled = false
timeout_seconds = 10

[LOCAL_MANIFEST_ARCHIVE]
; Permanent local metadata archive. Keep this on durable storage and never
; place it inside staging_dir or another directory removed by archive cleanup.
;
; Two independent things live under this root, in SEPARATE namespaces so a
; prune of one can never take the other with it:
;   exports/…         small-file manifest exports (migration 010)
;   scan_segments/…   incremental-scan segment artifacts (Plan 1 Task 2.2)
;
; The scan segments are what make a frontier restart cheap: the per-file detail
; of a scanned directory is written here as JSONL.zst, and PostgreSQL stores
; only the ordinal range, the aggregate counts and a ROOT-RELATIVE locator — so
; this whole tree can be moved to different storage without rewriting a single
; catalog row. They carry no content hashes (hashing would mean reading every
; source byte over SSH, which is the fetch, not the scan).
;
; BACK THIS UP with the database. A lost segment artifact does not lose
; archived data, but it does lose the record of which directories were already
; covered, which forces a full re-scan.
root = "D:\LTO_METADATA\LOCAL_MANIFEST_ARCHIVE"
search_limit = 500

[WINDOWS_UPDATE]
; --- Forced-update guard ----------------------------------------------------
; A forced Windows Update restart during a tape write kills the writer before
; LTFS can sync its index: every chunk written in that session is lost from
; the cartridge even though the writes were acknowledged. This happened on
; 2026-07-15 and cost ~126 GB (chunks 18-91 of session 37 on Tape_02).
; The guard does not disable Windows Update. Two layers:
;   1. Pause — uses the supported "pause updates" mechanism to move the update
;      window outside the run, restored when the run ends. Requires
;      Administrator. On a centrally-managed host (domain/WSUS/Intune) this
;      layer may be IGNORED: policy SetDisablePauseUXAccess=1 removes the pause
;      feature, and a compliance deadline forces a restart regardless. The
;      registry writes still succeed, so the guard detects this and says so
;      rather than reporting false protection.
;   2. Reboot sentinel — polls for a staged restart during the run and stops
;      cleanly at the next chunk boundary so LTFS syncs its index and the
;      session stays resumable. This is the layer that survives an
;      administrator-forced update. It needs no elevation and is always on.
; If your host is managed, the durable fix is organizational: ask IT to exempt
; it from the update deadline policy.
guard = true
; How long to pause updates while a run is active. Cover the longest run you
; expect, with margin — a full session resume can take days. Windows caps a
; pause at 35 days; values above 30 are clamped.
pause_days = 7
; Refuse to start when Windows already has a restart staged. Pausing cannot
; cancel an already-staged restart, so the only safe move is to reboot first.
; Set false only if you accept losing the run to a restart.
block_on_pending_reboot = true

[FEATURES]
; --- Experimental / staged features (fail-closed) ---------------------------
; Phase 5 sealed tape-write batches: a durable, sealed physical-write-group
; object layered on top of per-chunk truth (see docs/PHASE5_SEALED_BATCH_DESIGN.md).
; Default false. While false the production runtime queries/mutates no batch
; table. Enabling it requires the scripts/sql/012 schema applied to this
; database; a later approved phase wires the startup preflight that fails closed
; when the flag is on but the schema is missing.
sealed_tape_write_batches_enabled = false
; Phase 5C observation mode: an observation-only shadow that computes what a
; sealed batch WOULD be and logs a comparison. Default false -> no observer is
; constructed. When true the observer can never change the writer, ReadyQueue,
; chunk status, LTFS, or stop/resume/retry, and its failures never block the
; writer. Enabling this does NOT enable sealed batches.
sealed_tape_write_batches_observation_enabled = false

[OBSERVATION]
; --- Phase 5D bounded async observation (only used when observation is on) ---
; The writer thread only copies an immutable snapshot and does ONE non-blocking
; enqueue at the finite-group boundary; a dedicated worker thread does the DB
; read + observer computation + JSONL logging. A full queue drops the
; observation (never the write group). All of this is inert while observation is
; disabled above.
sealed_batch_observation_queue_max = 100
sealed_batch_observation_shutdown_timeout_seconds = 5
sealed_batch_observation_statement_timeout_seconds = 5
; Local diagnostic JSONL. MUST NOT be inside the repo, the LTFS mount, a pack /
; staging dir, or the diagnostic-evidence tree (validated at build time; an
; invalid path disables observation only). Default: a temp-dir path.
sealed_batch_observation_log_path = C:\lto8-observations\sealed_batch_observations.jsonl
sealed_batch_observation_log_max_bytes = 10485760
sealed_batch_observation_log_backups = 5

[STORAGE_MAP]
; --- Storage Map & Analytics -----------------------------------------------
; Two-stage, decoupled remote disk-usage mapper. Mounts are loaded from here
; (never hardcoded) so they can be adjusted per server at any time. SSH user /
; password default to the [REMOTE] account (secret still in .env).
; Local directory for raw logs + generated HTML treemaps (relative to project root).
output_dir = storage_map/logs
; Directory for the self-contained HTML dashboard (index.html).
dashboard_dir = storage_map
; du reporting depth (Mount -> immediate child, plus one level inside shared-data).
scan_depth = 2
; Advisory upper bound on remote scan time (scan/fetch never block this long).
poll_timeout_seconds = 14400
; Shared mount list scanned on every server (one path per line, or comma list).
; A [STORAGE_MAP:<name>] section may override this with its own 'mounts'.
mounts =
    /strg/D
    /strg/E
    /data
    /strg/C
    /data_ssd
    /
; Servers to scan (each needs a matching [STORAGE_MAP:<name>] section below).
servers = so01, so02
; --- Storage Map web app (python storage_map/run_app.py) ---------------------
; All optional; the web app runs with these defaults without any edits.
; The app is intentionally bound to 127.0.0.1 and is available only here.
;web_port = 8765
; Open Google Chrome automatically when run_app.py starts.
;open_chrome = false
; Directory levels below each mount compared against the archive DB in the
; tape-coverage table. Depth 2 is used only inside shared-data.
;match_depth = 2
; Optional mapping of files_index.source_host values to server names above,
; for DB hosts whose short hostname differs from the config name.
; Format: dbhost:server, dbhost2:server2
;host_map =

[STORAGE_MAP:so01]
host = so01.example.host
user = your-username

[STORAGE_MAP:so02]
host = so02.example.host
user = your-username
