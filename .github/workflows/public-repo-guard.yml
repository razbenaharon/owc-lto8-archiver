# Keeps the repository publishable.
#
# The privacy gate is the point of this workflow. A month from now nobody will
# remember that the manifest root, the catalog dumps and the campaign receipts
# are operational data — the gate remembers, and fails the build rather than
# letting a database, a real manifest, a log or an infrastructure identity get
# committed. The test suite runs alongside it so a green check means both
# "safe to publish" and "not broken".
name: public-repo-guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The privacy gate reads git history with the standard library only, so it is
  # platform-independent and runs once on the cheaper runner.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate inspects git history, not just the working tree.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Privacy gate
        run: python scripts/check_public_repo.py

  # Windows, because the product is Windows: the suite exercises ctypes.windll
  # mutexes, powershell.exe, robocopy exit classification and drive-letter
  # paths. Running it on ubuntu-latest — as this workflow used to — could only
  # ever fail, and did.
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the declared requirements rather than a hand-picked subset.
      # The previous list omitted psycopg, so the eighteen pg_test_guard tests
      # failed on every run instead of exercising the safety guard. Installing
      # the real file also proves requirements.txt stays resolvable.
      #
      # PySide6 is skipped on purpose: it is a ~150 MB desktop toolkit needed
      # only by the DB Inspector GUI, which has no headless test.
      # httpx is a test-only dependency of starlette's TestClient, used by the
      # Storage Map web app suite.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v '^PySide6' requirements.txt > ci-requirements.txt
          python -m pip install -r ci-requirements.txt
          python -m pip install pytest httpx
          rm ci-requirements.txt

      # The PostgreSQL suites skip without LTO_TEST_PG_DSN, which is correct
      # here: they need a disposable server and must never be pointed at a real
      # catalog. Tape and LTFS paths need the physical drive and also skip.
      - name: Offline test suite
        run: python -m pytest tests/ -q

      - name: Syntax sweep
        run: python -m compileall -q src storage_map scripts run.py inspect_db.py

      # config.ini is untracked and the suite must never create one. A file
      # here means a test wrote into the operator's real configuration path.
      - name: Assert the suite left no config.ini behind
        shell: bash
        run: |
          if [ -e config.ini ]; then
            echo "::error::the test suite created a config.ini in the repo root"
            exit 1
          fi
